services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: safeplace
      POSTGRES_PASSWORD: safeplace123
      POSTGRES_DB: safeplace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://safeplace:safeplace123@postgres:5432/safeplace_db
      JWT_SECRET: local_jwt_secret_dev
      JWT_EXPIRES_IN: 8h
      DEVICE_TOKEN_SECRET: local_device_secret_dev
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
